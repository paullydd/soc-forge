[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-forge"
version = "3.6.0"
description = "Local analyst-centric security investigation platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "colorama>=0.4.6,<0.5",
  "rich>=13.0",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "python-evtx>=0.8.1,<0.9",
  "defusedxml>=0.7.1,<0.8",
]

[project.scripts]
soc-forge = "soc_forge.cli:main"
soc-forge-web = "soc_forge.web.app:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["soc_forge*"]
[tool.setuptools.package-data]
"soc_forge.web" = ["static/*.html", "static/*.css", "static/*.js"]
"soc_forge.rules" = ["*.yml"]
