version: 1
rules:
- id: SOCF-008
  enabled: true
  title: User added to privileged group
  severity: high
  score: 75
  mitre:
  - tactic: Persistence
    technique: Account Manipulation
    id: T1098
  - tactic: Privilege Escalation
    technique: Account Manipulation
    id: T1098
  match:
    all:
    - any:
      - field: event_id
        op: eq
        value: 4732
      - field: event_id
        op: eq
        value: 4756
    - field: group_name
      op: regex
      value: (?i)^(administrators|enterprise admins|remote desktop users|backup operators)$
  emit:
    details:
      host: ${host}
      ip: ${ip}
      actor: ${actor}
      target_user: ${target_user}
      group_name: ${group_name}
      message: ${message}
      suspicious: true
  description: Detects additions to privileged local or universal Windows groups using structured group-change events.
  logsource: windows-security
  tags:
  - windows
  - identity
  - privileged-group
  author: SOC-Forge
  created: '2026-07-17'
