version: 1
rules:
  - id: SOCF-027
    enabled: true
    title: SSH accepted logon from external source address (possible initial access)
    description: Detects a successful SSH authentication originating from a source
      address outside common private/loopback/link-local ranges. This is a heuristic
      on the address prefix, not full IP validation, and does not confirm the
      address is actually internet-routable. Linux twin of SOCF-023 (RDP external
      logon), applied to sshd auth-log events instead of Windows RDP logons.
    author: SOC-Forge
    created: "2026-09-16"
    logsource: linux-auth-log
    tags:
      - linux
      - ssh
      - initial-access
      - external
    severity: high
    score: 70
    mitre:
      - tactic: Initial Access
        technique: External Remote Services
        id: T1133
    match:
      all:
        - field: process_name
          op: eq
          value: sshd
        - any:
            - field: auth_result
              op: eq
              value: success
            - field: message
              op: regex
              value: '(?i)^Accepted\s+(password|publickey|keyboard-interactive)\s+for\b'
        - field: ip
          op: regex
          value: '^(?!(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.|169\.254\.))'
    emit:
      details:
        host: "${host}"
        ip: "${ip}"
        username: "${username}"
        auth_method: "${auth_method}"
        message: "${message}"
