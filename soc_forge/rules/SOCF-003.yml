version: 1
rules:
- id: SOCF-003
  enabled: true
  title: Privileged group membership change (new admin)
  severity: high
  score: 90
  mitre:
  - tactic: Persistence
    technique: Account Manipulation
    id: T1098
  match:
    all:
    - field: event_id
      op: eq
      value: 4728
    - field: group_name
      op: eq
      value: Domain Admins
  emit:
    details:
      host: ${host}
      actor: ${actor}
      username: ${username}
      group_name: ${group_name}
      message: ${message}
  description: Detects additions to the privileged Domain Admins global group.
  logsource: windows-security
  tags:
  - windows
  - identity
  - privilege-escalation
  author: SOC-Forge
  created: '2026-07-17'
