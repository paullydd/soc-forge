name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Validate installed wheel
        run: |
          python -m pip install dist/*.whl
          python -c "import soc_forge; assert soc_forge.__version__ == '3.6.0'"
          python -c "from soc_forge.rules import BUILTIN_RULES_PATH; from soc_forge.rules.engine import load_rules; assert len(load_rules([str(BUILTIN_RULES_PATH)])) == 21"
          python -c "from soc_forge.investigations.handoff import InvestigationHandoffService"
